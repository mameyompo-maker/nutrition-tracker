<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>食事栄養トラッカー</title>
<meta name="description" content="食事の写真から栄養素を分析し、その日に必要な栄養量と比較するアプリ">
<meta name="theme-color" content="#37613C">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="栄養トラッカー">
<link rel="icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="small-nav" aria-hidden="true"><span id="small-nav-title"></span></div>
  <div id="app"></div>

  <nav id="tabbar" class="hidden" aria-label="メインナビゲーション">
    <button class="tab-btn" data-view="home"><span class="ic-wrap"></span><span class="tab-label">ホーム</span></button>
    <button class="tab-btn" data-view="capture"><span class="ic-wrap"></span><span class="tab-label">記録</span></button>
    <button class="tab-btn" data-view="trends"><span class="ic-wrap"></span><span class="tab-label">トレンド</span></button>
    <button class="tab-btn" data-view="history"><span class="ic-wrap"></span><span class="tab-label">履歴</span></button>
    <button class="tab-btn" data-view="settings"><span class="ic-wrap"></span><span class="tab-label">設定</span></button>
  </nav>

  <div id="sheet-root" class="hidden"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./icons.js"></script>
  <script src="./nutrition.js"></script>
  <script src="./exif.js"></script>
  <script src="./storage.js"></script>
  <script src="./charts.js"></script>
  <script src="./api.js"></script>
  <script src="./share.js"></script>
  <script src="./app.js"></script>
</body>
</html>
